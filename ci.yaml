# toji-ci config for goquest (read by toji-ci tekton/tasks/_parse_ci_config.py,
# validated against toji-ci/schema/ci.schema.json). Mirrors goquest-mcp/ci.yaml.
#   push -> test + build + push  artifacts.toji.homes/neunexus/goquest-service:{sha,latest}
#   pr   -> test + build only (validation)
#
# Without this file toji-ci ran the pipeline but built/pushed no image, so
# argocd-image-updater (watching goquest-service:latest) never advanced and the
# cluster stayed on the last manually-pushed image. This restores continuous
# build+deploy for goquest-service.
#
# The multi-stage Dockerfile defaults to `ARG CMD=service`, so the default build
# produces the goquest-service binary. goquest-ui / goquest-bot are built/deployed
# separately and are intentionally out of scope here.
domain: container
registry: artifacts.toji.homes/neunexus
images:
  - name: goquest-service
    dockerfile: Dockerfile
# go toolchain auto-selected from the `go` command prefix. The pgx integration
# tests skip cleanly without GOQUEST_TEST_DATABASE_URL, so this runs standalone.
test:
  run: go build ./... && go vet ./... && go test ./...
# Immediately sync the goquest-service ArgoCD app after a successful build,
# skipping the argocd-image-updater poll cycle (~2-5 min).
sync_apps:
  - goquest-service
