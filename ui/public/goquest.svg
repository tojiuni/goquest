<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Hexagon background -->
  <path d="M32 3 L57 17.5 L57 46.5 L32 61 L7 46.5 L7 17.5 Z"
        fill="url(#bg)" rx="3"/>

  <!-- Ticket/card shape -->
  <rect x="16" y="20" width="32" height="22" rx="3"
        fill="white" opacity="0.15"/>
  <rect x="16" y="20" width="32" height="22" rx="3"
        fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>

  <!-- Ticket notch left -->
  <circle cx="16" cy="31" r="3.5" fill="url(#bg)"/>
  <!-- Ticket notch right -->
  <circle cx="48" cy="31" r="3.5" fill="url(#bg)"/>
  <!-- Dashed separator -->
  <line x1="19" y1="31" x2="45" y2="31"
        stroke="white" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Check mark -->
  <path d="M24 30 L29 35 L40 24"
        stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>

  <!-- Trophy star at top-right -->
  <path d="M46 10 L47.5 13.5 L51 13.8 L48.5 16.1 L49.2 19.5 L46 17.5 L42.8 19.5 L43.5 16.1 L41 13.8 L44.5 13.5 Z"
        fill="#FCD34D" opacity="0.9"/>
</svg>
