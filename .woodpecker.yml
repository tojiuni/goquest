# goquest CI/CD — Woodpecker + Kaniko
#
# 흐름:
#   test → (main) registry-login → build-service + build-bot
#                                        ↓
#                     ArgoCD Image Updater가 digest 변경 감지 → 자동 rollout
#
# 빌드 대상 이미지:
#   artifacts.toji.homes/neunexus/goquest-service:{sha7} + :latest
#   artifacts.toji.homes/neunexus/goquest-bot:{sha7}    + :latest
#
# Woodpecker secrets 필요:
#   REGISTRY_TOKEN — artifacts.toji.homes woodpecker-ci 계정 토큰

labels:
  platform: linux/amd64

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  # ── 1. 단위 테스트 ──────────────────────────────────────────────────────────
  - name: test
    image: golang:1.25-alpine
    commands:
      - go test ./... -count=1

  # ── 2. 레지스트리 인증 ─────────────────────────────────────────────────────
  - name: registry-login
    image: alpine:3.20
    environment:
      REGISTRY_TOKEN:
        from_secret: REGISTRY_TOKEN
    commands:
      - |
        TOKEN=$(printenv REGISTRY_TOKEN || true)
        if [ -z "$TOKEN" ]; then
          echo "ERROR: REGISTRY_TOKEN secret is not set"
          exit 1
        fi
        mkdir -p .docker
        printf '{"auths":{"artifacts.toji.homes":{"auth":"%s"}}}\n' \
          "$(printf 'woodpecker-ci:%s' "$TOKEN" | base64 | tr -d '\n')" \
          > .docker/config.json
        echo "Registry login config written."
    when:
      - event: push
        branch: main
      - event: manual

  # ── 3. 이미지 빌드 & 푸시 ─────────────────────────────────────────────────
  - name: build-service
    image: gcr.io/kaniko-project/executor:debug
    commands:
      - |
        export DOCKER_CONFIG=$(pwd)/.docker
        /kaniko/executor \
          --context=dir://$(pwd) \
          --dockerfile=$(pwd)/Dockerfile \
          --build-arg CMD=service \
          --destination=artifacts.toji.homes/neunexus/goquest-service:${CI_COMMIT_SHA:0:7} \
          --destination=artifacts.toji.homes/neunexus/goquest-service:latest \
          --cache=true \
          --cache-repo=artifacts.toji.homes/neunexus/goquest-service/cache
    when:
      - event: push
        branch: main
      - event: manual

  - name: build-bot
    image: gcr.io/kaniko-project/executor:debug
    commands:
      - |
        export DOCKER_CONFIG=$(pwd)/.docker
        /kaniko/executor \
          --context=dir://$(pwd) \
          --dockerfile=$(pwd)/Dockerfile \
          --build-arg CMD=bot \
          --destination=artifacts.toji.homes/neunexus/goquest-bot:${CI_COMMIT_SHA:0:7} \
          --destination=artifacts.toji.homes/neunexus/goquest-bot:latest \
          --cache=true \
          --cache-repo=artifacts.toji.homes/neunexus/goquest-bot/cache
    when:
      - event: push
        branch: main
      - event: manual

  # ── PR 검증 (푸시 없이 빌드만) ─────────────────────────────────────────────
  - name: validate
    image: gcr.io/kaniko-project/executor:debug
    commands:
      - |
        /kaniko/executor \
          --context=dir://$(pwd) \
          --dockerfile=$(pwd)/Dockerfile \
          --build-arg CMD=service \
          --no-push --snapshot-mode=redo
      - |
        /kaniko/executor \
          --context=dir://$(pwd) \
          --dockerfile=$(pwd)/Dockerfile \
          --build-arg CMD=bot \
          --no-push --snapshot-mode=redo
    when:
      - event: pull_request
