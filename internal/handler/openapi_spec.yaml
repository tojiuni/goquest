# Source of truth for the agent-facing ticket OpenAPI spec. Embedded by
# openapi.go (go:embed) and served at /api/v1/openapi.{yaml,json}.
openapi: 3.1.0
info:
  title: goquest tickets API
  version: "1.0.0"
  description: >
    Agent-facing ticket operations. Authenticate with the X-API-Key header
    (project-scoped). title_name is a human handle (e.g. goq-vault-portforward),
    unique per project, matching ^[a-z][a-z0-9]*(-[a-z0-9]+)+$.
servers:
  - url: https://goquest.toji.homes/api/v1
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CreateTicketReq:
      type: object
      required: [title]
      properties:
        title: { type: string }
        title_name:
          type: string
          description: lowercase hyphen-separated handle, unique per project
        description: { type: string }
        type: { type: string, enum: [task, bug, feature, incident, request] }
        priority: { type: string, enum: [urgent, high, normal, low] }
        domain: { type: string, enum: [infra, data, code, monitor, knowledge, pm] }
        project_id: { type: string, format: uuid }
        workspace_name: { type: string }
        workspace_slug: { type: string }
        project_name: { type: string }
        parent_id: { type: string, format: uuid }
        tag_ids: { type: array, items: { type: string, format: uuid } }
        tag_names:
          type: array
          items: { type: string }
          description: tag names; missing tags are created in the project's workspace
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        title_name: { type: string }
        title: { type: string }
        status: { type: string }
        priority: { type: string }
        domain: { type: string }
        project_id: { type: string, format: uuid }
security:
  - ApiKeyAuth: []
paths:
  /tickets:
    post:
      summary: Create a ticket (idempotent on title_name within a project)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketReq' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '200':
          description: existing ticket replayed (header X-Idempotent-Replay=true)
          content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } }
        '400': { description: bad request }
    get:
      summary: List tickets
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: title_name, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string }, description: repeatable tag-name filter (requires project_id) }
        - { name: status, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: free-text search (case-insensitive substring over title, title_name, description) }
      responses:
        '200': { description: ok }
  /tickets/bulk:
    post:
      summary: Bulk-update many tickets with one patch (per-id manage authz, partial success)
      description: >
        Applies one patch to each id independently. Manage permission is checked
        per ticket; a per-id failure (bad id, not found, forbidden, invalid
        transition) is reported in results without aborting the rest. Always 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, patch]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: 1 to 100 ticket ids
                patch:
                  type: object
                  description: same fields as PATCH /tickets/{id} (status/assignee_id/domain/risk_tier/project_id/...)
      responses:
        '200':
          description: per-id results
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        '400': { description: empty or oversized ids, or invalid body }
  /tickets/bulk-create:
    post:
      summary: Create many child tickets under one parent (per-item partial success)
      description: >
        Creates each item as a child ticket under parent_id, inheriting the
        parent's project/type/priority/domain (goq-cogito-bulk-create-api — the
        cogito content-split / question-decomposition consumer). Manage
        permission is checked once against parent_id, not per item. A per-item
        failure (e.g. empty title) is reported in results without aborting the
        rest. Always 200 once the parent lookup/authz gate passes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id, items, source]
              properties:
                parent_id: { type: string, format: uuid }
                items:
                  type: array
                  description: 1 to 50 items
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string }
                      description: { type: string }
                source:
                  type: string
                  enum: [content-split, question-decomposition, manual]
                source_ref:
                  type: string
                  description: optional freeform reference to the originating text/chat message
      responses:
        '200':
          description: per-item results
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        '400': { description: empty or oversized items, invalid source, or invalid body }
        '403': { description: caller lacks manage permission on parent_id }
        '404': { description: parent_id not found }
  /analytics/tickets:
    get:
      summary: Aggregate ticket counts grouped by one whitelisted column
      description: >
        COUNT(*) grouped by group_by, scoped by the same optional filters as the
        ticket list (project_id, workspace_id, status) plus the caller's SpiceDB
        visibility. Buckets are ordered by descending count.
      parameters:
        - { name: group_by, in: query, required: true, schema: { type: string, enum: [status, type, priority, domain, risk_tier, assignee_id, assignee_type] } }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: aggregation buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_by: { type: string }
                  total: { type: integer }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        count: { type: integer }
        '400': { description: missing or unknown group_by, or invalid id }
  /tickets/by-name/{title_name}:
    get:
      summary: Look up a ticket by title_name within a project
      parameters:
        - { name: title_name, in: path, required: true, schema: { type: string } }
        - { name: workspace, in: query, schema: { type: string } }
        - { name: workspace_slug, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '400': { description: missing/unresolvable identifiers }
        '404': { description: not found }
  /tickets/{id}:
    get:
      summary: Get a ticket by UUID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    patch:
      summary: Update a ticket
      description: >
        Partial update. project_id moves the ticket to another project in the
        SAME workspace (400 on unknown target or cross-workspace move, 409 on a
        title_name collision in the target project).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: ok }
        '400': { description: unknown target project or cross-workspace move }
        '409': { description: title_name already exists in the target project }
