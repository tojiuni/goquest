# Source of truth for the agent-facing ticket OpenAPI spec. Embedded by
# openapi.go (go:embed) and served at /api/v1/openapi.{yaml,json}.
openapi: 3.1.0
info:
  title: goquest tickets API
  version: "1.0.0"
  description: >
    Agent-facing ticket operations. Authenticate with the X-API-Key header
    (project-scoped). title_name is a human handle (e.g. goq-vault-portforward),
    unique per project, matching ^[a-z][a-z0-9]*(-[a-z0-9]+)+$.
servers:
  - url: https://goquest.toji.homes/api/v1
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CreateTicketReq:
      type: object
      required: [title]
      properties:
        title: { type: string }
        title_name:
          type: string
          description: lowercase hyphen-separated handle, unique per project
        description: { type: string }
        type: { type: string, enum: [task, bug, feature, incident, request] }
        priority: { type: string, enum: [urgent, high, normal, low] }
        domain: { type: string, enum: [infra, data, code, monitor, knowledge, pm] }
        project_id: { type: string, format: uuid }
        workspace_name: { type: string }
        workspace_slug: { type: string }
        project_name: { type: string }
        parent_id: { type: string, format: uuid }
        tag_ids: { type: array, items: { type: string, format: uuid } }
        tag_names:
          type: array
          items: { type: string }
          description: tag names; missing tags are created in the project's workspace
    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        title_name: { type: string }
        title: { type: string }
        status: { type: string }
        priority: { type: string }
        domain: { type: string }
        project_id: { type: string, format: uuid }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        author_id: { type: string }
        author_kind: { type: string, enum: [staff, agent, customer, system] }
        body: { type: string }
        is_internal: { type: boolean }
        is_draft: { type: boolean }
        gardener_score: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
    TicketRelation:
      type: object
      description: A typed directed edge between two tickets (row shape returned by POST/DELETE).
      properties:
        id: { type: string, format: uuid }
        from_ticket_id: { type: string, format: uuid }
        to_ticket_id: { type: string, format: uuid }
        relation_type: { type: string, enum: [blocks, depends_on, duplicates] }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    TicketRelationView:
      type: object
      description: >
        The GET .../relations row shape: direction/label are computed
        server-side relative to the queried ticket, and the other-side
        ticket's summary is inlined so clients don't need a second
        round-trip per row. Rows whose other-side ticket the caller cannot
        view are omitted entirely (not returned as an error).
      properties:
        id: { type: string, format: uuid }
        relation_type: { type: string, enum: [blocks, depends_on, duplicates] }
        direction: { type: string, enum: [outgoing, incoming] }
        label:
          type: string
          description: >
            Human-readable label relative to the queried ticket, e.g.
            outgoing blocks="Blocks"/incoming blocks="Blocked by".
        other_ticket_id: { type: string, format: uuid }
        other_ticket_title_name: { type: string }
        other_ticket_title: { type: string }
        other_ticket_status: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    ApprovalSubject:
      type: object
      description: >
        What is being approved. merge: repo + pr + head_sha. design: doc.
        infra/ops: repo+pr, doc or target. deviation: doc.
      properties:
        repo: { type: string, description: 'owner/name' }
        pr: { type: integer }
        head_sha: { type: string }
        doc: { type: string, description: geneso path }
        doc_sha: { type: string }
        target: { type: string }
    ApprovalEvidence:
      type: object
      required: [type, ref]
      properties:
        type: { type: string, description: 'pr, ci_run, test, doc, comment, ...' }
        ref: { type: string }
        note: { type: string }
    Approval:
      type: object
      description: >
        One append-only approval record. requested_by / decided_by / basis are
        derived by the server from the authenticated principal; request bodies
        cannot set them.
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        kind: { type: string, enum: [design, merge, infra, ops, deviation, ticket] }
        subject: { $ref: '#/components/schemas/ApprovalSubject' }
        status: { type: string, enum: [pending, approved, rejected, revision_requested, withdrawn, superseded] }
        requested_by: { type: string }
        requested_by_label: { type: string }
        requested_at: { type: string, format: date-time }
        request_note: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/ApprovalEvidence' } }
        within_direction: { type: boolean, description: 'deviation only: true if it stays inside the approved design direction' }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        decision_note: { type: string }
        basis: { type: string, enum: [user_direct, desk_delegated] }
        delegation_rule_id: { type: string, format: uuid }
        user_ref: { type: string }
        supersedes_id: { type: string, format: uuid }
        legacy: { type: boolean }
        events:
          type: array
          description: status transitions (single-approval GET only)
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              actor: { type: string }
              note: { type: string }
              created_at: { type: string, format: date-time }
    Mention:
      type: object
      description: >
        One @mention of the caller, with just enough context to open the ticket.
        comment_snippet is an excerpt of the comment the mention appeared in and
        only ever reaches the mentioned actor (this is the caller's own inbox).
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        ticket_title: { type: string }
        comment_id: { type: string, format: uuid }
        mentioned_actor_id: { type: string }
        source: { type: string, enum: [comment, description] }
        created_by: { type: string }
        created_by_name: { type: string }
        comment_snippet: { type: string }
        created_at: { type: string, format: date-time }
        seen_at: { type: string, format: date-time, nullable: true }
security:
  - ApiKeyAuth: []
paths:
  /tickets:
    post:
      summary: Create a ticket (idempotent on title_name within a project)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketReq' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '200':
          description: existing ticket replayed (header X-Idempotent-Replay=true)
          content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } }
        '400': { description: bad request }
    get:
      summary: List tickets
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: title_name, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string }, description: repeatable tag-name filter (requires project_id) }
        - { name: status, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: free-text search (case-insensitive substring over title, title_name, description) }
      responses:
        '200': { description: ok }
  /tickets/bulk:
    post:
      summary: Bulk-update many tickets with one patch (per-id manage authz, partial success)
      description: >
        Applies one patch to each id independently. Manage permission is checked
        per ticket; a per-id failure (bad id, not found, forbidden, invalid
        transition) is reported in results without aborting the rest. Always 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, patch]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: 1 to 100 ticket ids
                patch:
                  type: object
                  description: same fields as PATCH /tickets/{id} (status/assignee_id/domain/risk_tier/project_id/...)
      responses:
        '200':
          description: per-id results
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        '400': { description: empty or oversized ids, or invalid body }
  /tickets/bulk-create:
    post:
      summary: Create many child tickets under one parent (per-item partial success)
      description: >
        Creates each item as a child ticket under parent_id, inheriting the
        parent's project/type/priority/domain (goq-cogito-bulk-create-api — the
        cogito content-split / question-decomposition consumer). Manage
        permission is checked once against parent_id, not per item. A per-item
        failure (e.g. empty title) is reported in results without aborting the
        rest. Always 200 once the parent lookup/authz gate passes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id, items, source]
              properties:
                parent_id: { type: string, format: uuid }
                items:
                  type: array
                  description: 1 to 50 items
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string }
                      description: { type: string }
                source:
                  type: string
                  enum: [content-split, question-decomposition, manual]
                source_ref:
                  type: string
                  description: optional freeform reference to the originating text/chat message
      responses:
        '200':
          description: per-item results
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        '400': { description: empty or oversized items, invalid source, or invalid body }
        '403': { description: caller lacks manage permission on parent_id }
        '404': { description: parent_id not found }
  /tickets/{id}/subtasks/from-text:
    post:
      summary: Split free-form text into child tickets via cogito (goq-cogito-subtasks-from-text)
      description: >
        Calls cogito's SplitContent RPC on text, then bulk-creates each
        top-level returned section (title/contents) as a child ticket under
        {id} using the same path as POST /tickets/bulk-create with
        source=content-split. Manage permission is checked once against {id}.
        v1 only uses top-level sections; sub_sections are not recursed into.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                title:
                  type: string
                  description: optional prompt context passed through to cogito
      responses:
        '200':
          description: per-item results (same shape as POST /tickets/bulk-create)
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        '400': { description: empty text, invalid body, or cogito produced zero sections }
        '403': { description: caller lacks manage permission on id }
        '404': { description: id not found }
        '502': { description: cogito client unavailable or SplitContent RPC failed }
  /tickets/{id}/subtasks/from-chat:
    post:
      summary: Decompose a chat question into task-candidate child tickets via cogito (goq-cogito-subtasks-from-chat)
      description: >
        Calls cogito's DecomposeQuestion RPC on message (with optional prior
        chat history for context), always in TASK_CANDIDATES mode, then
        bulk-creates each returned task candidate (title/description) as a
        child ticket under {id} using the same path as POST
        /tickets/bulk-create with source=question-decomposition. Manage
        permission is checked once against {id}. message is stored as
        source_ref (surfaced in each created ticket's metadata), the same way
        SubtasksFromText passes its source_ref.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                history:
                  type: array
                  description: optional prior conversation turns passed through to cogito
                  items:
                    type: object
                    properties:
                      role: { type: string }
                      content: { type: string }
      responses:
        '200':
          description: per-item results (same shape as POST /tickets/bulk-create)
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        '400': { description: empty message, invalid body, or cogito produced zero task candidates }
        '403': { description: caller lacks manage permission on id }
        '404': { description: id not found }
        '502': { description: cogito client unavailable or DecomposeQuestion RPC failed }
  /analytics/tickets:
    get:
      summary: Aggregate ticket counts grouped by one whitelisted column
      description: >
        COUNT(*) grouped by group_by, scoped by the same optional filters as the
        ticket list (project_id, workspace_id, status) plus the caller's SpiceDB
        visibility. Buckets are ordered by descending count.
      parameters:
        - { name: group_by, in: query, required: true, schema: { type: string, enum: [status, type, priority, domain, risk_tier, assignee_id, assignee_type] } }
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: aggregation buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_by: { type: string }
                  total: { type: integer }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        count: { type: integer }
        '400': { description: missing or unknown group_by, or invalid id }
  /tickets/by-name/{title_name}:
    get:
      summary: Look up a ticket by title_name within a project
      parameters:
        - { name: title_name, in: path, required: true, schema: { type: string } }
        - { name: workspace, in: query, schema: { type: string } }
        - { name: workspace_slug, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '400': { description: missing/unresolvable identifiers }
        '404': { description: not found }
  /tickets/{id}:
    get:
      summary: Get a ticket by UUID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: ok }
        '404': { description: not found }
    patch:
      summary: Update a ticket
      description: >
        Partial update. project_id moves the ticket to another project in the
        SAME workspace (400 on unknown target or cross-workspace move, 409 on a
        title_name collision in the target project). parent_id reparents the
        ticket; the target must exist and be in the SAME project as this
        ticket (400 on unknown target, cross-project target, self-parenting,
        or a target that is one of this ticket's own descendants). Clearing
        parent_id to make the ticket top-level is not supported.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: ok }
        '400': { description: unknown target project/parent, cross-workspace move, cross-project parent, or a parent cycle }
        '409': { description: title_name already exists in the target project }
  /tickets/{id}/comments:
    get:
      summary: List comments on a ticket
      description: >
        Returns all comments on the ticket, oldest first. Internal-only
        comments are included only when the caller can see internal comments
        (staff API keys); customer-scoped callers only ever see
        is_internal=false comments.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
        '400': { description: invalid ticket id }
  /tickets/{id}/relations:
    get:
      summary: List a ticket's relations (both directions), with other-side ticket summaries
      description: >
        Returns every relation where {id} is either side, each carrying a
        server-computed direction ("outgoing"/"incoming") and label plus a
        summary of the other-side ticket. Rows whose other-side ticket the
        caller cannot view are silently omitted (a visibility filter, not a
        403) so the response never confirms a relation exists to a
        restricted ticket the caller can't see.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  relations:
                    type: array
                    items: { $ref: '#/components/schemas/TicketRelationView' }
        '404': { description: ticket not found or not viewable }
    post:
      summary: Add a typed relation from {id} to another ticket (requires manage on {id})
      description: >
        Idempotent: replaying an existing (from, to, relation_type) returns
        200 with the existing row and created=false. The target
        (to_ticket_id) must exist AND be viewable by the caller — "doesn't
        exist" and "exists but not viewable" both return 404, to avoid
        creating an existence oracle for restricted tickets.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relation_type, to_ticket_id]
              properties:
                relation_type: { type: string, enum: [blocks, depends_on, duplicates] }
                to_ticket_id: { type: string, format: uuid }
      responses:
        '200':
          description: created or idempotently replayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  relation: { $ref: '#/components/schemas/TicketRelation' }
                  created: { type: boolean }
        '400': { description: invalid relation_type, self-reference, or invalid body }
        '403': { description: caller lacks manage permission on id }
        '404': { description: to_ticket_id not found or not viewable by the caller }
  /tickets/{id}/relations/{relation_id}:
    delete:
      summary: Remove a relation (requires manage on {id})
      description: >
        relation_id must belong to {id} (either side) — deleting a relation
        id that exists but is on an unrelated ticket pair returns 404, the
        same as a relation id that doesn't exist at all, so the caller can't
        distinguish the two cases.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: relation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: removed (idempotent for relations that belong to this ticket) }
        '400': { description: invalid relation_id }
        '403': { description: caller lacks manage permission on id }
        '404': { description: relation_id not found or not associated with id }
  /ticket-relations:
    get:
      summary: Bulk, paginated dump of all relations (service-to-service only)
      description: >
        Unfiltered by per-ticket SpiceDB visibility — intended for the brain
        importer's batch pull, same trust boundary as other service-to-
        service bulk reads. Requires X-API-Key authentication; JWT/session
        callers get 403.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 }, description: capped at 1000 }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  relations:
                    type: array
                    items: { $ref: '#/components/schemas/TicketRelation' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '403': { description: caller did not authenticate via X-API-Key }
  /tickets/{id}/approvals:
    post:
      summary: Request an approval on a ticket
      description: >
        Creates a pending approval record. The requester is the authenticated
        principal; kind=ticket is reserved. For kind=merge, any older head_sha
        approval (pending or approved) for the same repo+pr is superseded in
        the same call. An identical pending request returns 409.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, subject]
              properties:
                kind: { type: string, enum: [design, merge, infra, ops, deviation] }
                subject: { $ref: '#/components/schemas/ApprovalSubject' }
                request_note: { type: string }
                evidence: { type: array, items: { $ref: '#/components/schemas/ApprovalEvidence' } }
                within_direction: { type: boolean, description: 'required for kind=deviation' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { description: not allowed (no identity, or customer token) }
        '409': { description: an identical request is already pending }
        '422': { description: invalid kind/subject/evidence }
    get:
      summary: List a ticket's approvals, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected, revision_requested, withdrawn, superseded] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items: { $ref: '#/components/schemas/Approval' }
  /tickets/{id}/approvals/{aid}:
    get:
      summary: Get one approval with its status transitions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: aid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '404': { description: no such approval on this ticket }
  /tickets/{id}/approvals/{aid}/withdraw:
    post:
      summary: Withdraw your own pending approval request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: aid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { description: only the requester can withdraw }
        '404': { description: no such approval on this ticket }
        '409': { description: not pending any more }
  /tickets/{id}/approvals/{aid}/decision:
    post:
      summary: Decide a pending approval
      description: >
        Who decided and on what basis are derived by the server, never taken
        from the body. A person logged in to the goquest UI decides as
        basis=user_direct. A session account decides as basis=desk_delegated
        only when an active delegation rule covers the kind/repo, the kind is
        delegable (merge, or a deviation with within_direction=true), and the
        session is not the requester; user_ref (where the user granted it) is
        then required. design, infra, ops and a direction-changing deviation
        are user_direct only. API keys and other callers get 403.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: aid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected, revision_requested] }
                note: { type: string, description: required for rejected and revision_requested }
                user_ref: { type: string, description: required when deciding as a delegated session }
      responses:
        '200':
          description: decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403':
          description: >
            not allowed; body has reason: principal_cannot_decide,
            kind_not_delegable, no_matching_rule or self_approval
        '404': { description: no such approval on this ticket }
        '409': { description: not pending any more }
        '422': { description: invalid decision, missing note or user_ref }
  /users/mentions:
    get:
      summary: List the caller's own @mentions, newest first
      description: >
        The authenticated caller's mention inbox (the actor comes from the
        credential, never from a parameter). unseen_count is the number of
        mentions not yet marked seen, across all pages.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentions:
                    type: array
                    items: { $ref: '#/components/schemas/Mention' }
                  unseen_count: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '401': { description: missing requester }
  /mentions/{id}/seen:
    post:
      summary: Mark one of your mentions as seen
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: marked seen }
        '404': { description: no such mention for the caller }
